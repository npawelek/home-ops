---
name: "Flate"

"on":
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  flate:
    name: Flate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Render offline as the live cluster would; same sources as .mise.toml.
      - name: Set flate render env
        run: |
          echo "FLATE_KUBE_VERSION=$(yq '.kubernetesVersion' talos/topf.yaml)" >> "$GITHUB_ENV"
          echo "FLATE_API_VERSIONS=$(yq -p toml -oy '.env.FLATE_API_VERSIONS' .mise.toml)" >> "$GITHUB_ENV"

      # Exports FLATE_BASE, so test and diff below run in changed-only mode
      # against the default branch (no-op when nothing under kubernetes/ changed).
      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          base: "origin/${{ github.event.repository.default_branch }}"
          cache: true

      - name: Run flate test
        run: flate test all --path kubernetes/flux/cluster --no-progress

      - name: Run flate diff
        run: flate diff all --path kubernetes/flux/cluster --no-progress -o github > diff.patch

      - name: Generate Diff
        id: diff
        run: |
          # PR comments cap at 65536 characters
          head -c 60000 diff.patch > diff.trimmed
          if [ "$(wc -c < diff.patch)" -gt 60000 ]; then
            printf '\n# ... truncated, full diff in the job summary\n' >> diff.trimmed
          fi
          delim="EOF_$(openssl rand -hex 8)"
          {
              echo "diff<<${delim}"
              cat diff.trimmed
              echo "${delim}"
          } >> "$GITHUB_OUTPUT";
          {
              echo "### Diff"
              echo '```diff'
              cat diff.patch
              echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add Comment
        if: ${{ steps.diff.outputs.diff != '' }}
        continue-on-error: true
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12
        with:
          message-id: "${{ github.event.pull_request.number }}/kubernetes/flate"
          message-failure: Diff was not successful
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

      - name: Setup flux-schema version
        id: flux-schema
        run: echo "version=v$(yq -p toml -oy '.tools["github:fluxcd/flux-schema"]' .mise.toml)" >> "$GITHUB_OUTPUT"

      - name: Setup flux-schema
        uses: fluxcd/flux-schema/actions/setup@fac00ee3cb2fb0bd904c77e9e7727e98ba8a3c05 # v0.15.0
        with:
          version: ${{ steps.flux-schema.outputs.version }}

      # Changed-only via FLATE_BASE; yq is preinstalled on ubuntu runners.
      - name: Run flux-schema validate
        run: scripts/flux-schema-validate.sh
