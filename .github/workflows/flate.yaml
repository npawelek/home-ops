---
name: "Flate"

"on":
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  flate:
    name: Flate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Exports FLATE_BASE, so test and diff below run in changed-only mode
      # against the default branch (no-op when nothing under kubernetes/ changed).
      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          base: "origin/${{ github.event.repository.default_branch }}"
          cache: true

      - name: Run flate test
        run: flate test all --path kubernetes/flux/cluster --no-progress

      - name: Run flate diff
        run: flate diff all --path kubernetes/flux/cluster --no-progress -o github > diff.patch

      - name: Generate Diff
        id: diff
        run: |
          # PR comments cap at 65536 characters
          head -c 60000 diff.patch > diff.trimmed
          if [ "$(wc -c < diff.patch)" -gt 60000 ]; then
            printf '\n# ... truncated, full diff in the job summary\n' >> diff.trimmed
          fi
          delim="EOF_$(openssl rand -hex 8)"
          {
              echo "diff<<${delim}"
              cat diff.trimmed
              echo "${delim}"
          } >> "$GITHUB_OUTPUT";
          {
              echo "### Diff"
              echo '```diff'
              cat diff.patch
              echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add Comment
        if: ${{ steps.diff.outputs.diff != '' }}
        continue-on-error: true
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12
        with:
          message-id: "${{ github.event.pull_request.number }}/kubernetes/flate"
          message-failure: Diff was not successful
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```
