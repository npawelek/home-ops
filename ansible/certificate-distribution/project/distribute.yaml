---
- name: Pre-flight connectivity check
  hosts: all
  gather_facts: false

  tasks:
    - name: Check SSH port reachability
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        timeout: 5
        state: started
      delegate_to: localhost
      register: tcp_check
      failed_when: false
      changed_when: false

    - name: Group online hosts
      ansible.builtin.group_by:
        key: online
      when: tcp_check.state | default('') == 'started'

    - name: Report offline hosts
      ansible.builtin.debug:
        msg: "OFFLINE: {{ inventory_hostname }} ({{ ansible_host }}) — skipping all tasks"
      when: tcp_check.state | default('') != 'started'


- name: Distribute certificates
  hosts: online
  gather_facts: false

  tasks:
    - name: Get certificate from Kubernetes
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ cert_secret }}"
        namespace: "{{ cert_namespace }}"
      register: cert_secret_data
      delegate_to: localhost
      run_once: true
      no_log: true

    - name: Parse certificate data
      ansible.builtin.set_fact:
        cert_fullchain: "{{ cert_secret_data.resources[0].data['tls.crt'] | b64decode }}"
        cert_key: "{{ cert_secret_data.resources[0].data['tls.key'] | b64decode }}"
      delegate_to: localhost
      run_once: true
      no_log: true

    - name: Parse leaf certificate for Synology
      ansible.builtin.set_fact:
        cert_only: "{{ cert_fullchain.split('\\n-----BEGIN CERTIFICATE-----')[0] }}\\n"
      delegate_to: localhost
      run_once: true
      no_log: true

    - name: Get current certificate from service
      ansible.builtin.shell: |
        echo | openssl s_client -showcerts \
          -servername {{ certificate_hostname | default(ansible_host) }} \
          -connect {{ ansible_host }}:{{ certificate_port }} 2>/dev/null | \
          openssl x509
      delegate_to: localhost
      register: current_cert
      changed_when: false
      failed_when: false

    - name: Get current certificate expiration
      ansible.builtin.shell: |
        echo | openssl s_client -showcerts \
          -servername {{ certificate_hostname | default(ansible_host) }} \
          -connect {{ ansible_host }}:{{ certificate_port }} 2>/dev/null | \
          openssl x509 -noout -enddate
      delegate_to: localhost
      register: current_cert_expiry
      changed_when: false
      failed_when: false

    - name: Set pre-deployment status
      ansible.builtin.set_fact:
        cert_before:
          matches: "{{ current_cert.rc == 0 and (current_cert.stdout | default('')) in cert_fullchain }}"
          expiry: >-
            {{ current_cert_expiry.stdout.split('=')[1] | default('Unknown')
            if current_cert_expiry.rc | default(1) == 0 else 'Unknown' }}
          reachable: "{{ current_cert.rc | default(1) == 0 }}"


    - name: Deploy to Synology
      when: "'synology' in group_names"
      block:
        - name: Copy certificates to Synology
          ansible.builtin.raw: |
            if [ -f "{{ item.dest }}" ]; then
              cat > /tmp/new_cert_$$ << 'CERTEOF'
            {{ item.content }}
            CERTEOF
              if cmp -s /tmp/new_cert_$$ "{{ item.dest }}"; then
                rm /tmp/new_cert_$$
                echo "cert_unchanged"
                exit 0
              fi
              rm /tmp/new_cert_$$
            fi
            cat > {{ item.dest }} << 'CERTEOF'
            {{ item.content }}
            CERTEOF
            chmod {{ item.mode }} {{ item.dest }}
            echo "cert_changed"
          no_log: true
          register: synology_cert_result
          changed_when: synology_cert_result.stdout is search('\bcert_changed\b')
          loop:
            - content: "{{ cert_only }}"
              dest: "/usr/syno/etc/certificate/system/default/cert.pem"
              mode: "0600"
            - content: "{{ cert_fullchain }}"
              dest: "/usr/syno/etc/certificate/system/default/fullchain.pem"
              mode: "0600"
            - content: "{{ cert_key }}"
              dest: "/usr/syno/etc/certificate/system/default/privkey.pem"
              mode: "0600"
            - {content: "{{ cert_only }}", dest: "{{ synology_cert_dir }}/cert.pem", mode: "0400"}
            - {content: "{{ cert_fullchain }}", dest: "{{ synology_cert_dir }}/fullchain.pem", mode: "0400"}
            - {content: "{{ cert_key }}", dest: "{{ synology_cert_dir }}/privkey.pem", mode: "0400"}

        - name: Restart nginx
          ansible.builtin.raw: /usr/syno/bin/synosystemctl restart nginx
          when: not cert_before.matches


    - name: Deploy to UniFi
      when: "'unifi' in group_names"
      block:
        - name: Backup existing certs
          ansible.builtin.copy:
            src: "{{ item }}"
            dest: "{{ item }}.bak"
            remote_src: true
          loop:
            - /data/unifi-core/config/unifi-core.crt
            - /data/unifi-core/config/unifi-core.key

        - name: Copy certificates to UniFi
          ansible.builtin.copy:
            content: "{{ item.content }}"
            dest: "{{ item.dest }}"
            mode: "0644"
          no_log: true
          register: unifi_cert_result
          loop:
            - {content: "{{ cert_fullchain }}", dest: "/data/unifi-core/config/unifi-core.crt"}
            - {content: "{{ cert_key }}", dest: "/data/unifi-core/config/unifi-core.key"}

        - name: Restart unifi-core
          ansible.builtin.systemd:
            name: unifi-core
            state: restarted
          when: >
            (unifi_cert_result.results | selectattr('changed', 'equalto', true) | list | length > 0)
            or not cert_before.matches


    - name: Deploy to OctoPrint
      when: "'octoprint' in group_names"
      block:
        - name: Deploy certificate
          ansible.builtin.raw: |
            sudo mkdir -p /etc/ssl
            if [ -f "/etc/ssl/{{ cert_filename }}" ]; then
              cat > /tmp/new_cert_$$ << 'CERTEOF'
            {{ cert_fullchain }}{{ cert_key }}
            CERTEOF
              if sudo cmp -s /tmp/new_cert_$$ "/etc/ssl/{{ cert_filename }}"; then
                rm /tmp/new_cert_$$
                echo "cert_unchanged"
                exit 0
              fi
              rm /tmp/new_cert_$$
            fi
            cat > /tmp/new_cert_$$ << 'CERTEOF'
            {{ cert_fullchain }}{{ cert_key }}
            CERTEOF
            sudo mv /tmp/new_cert_$$ /etc/ssl/{{ cert_filename }}
            sudo chmod 0400 /etc/ssl/{{ cert_filename }}
            echo "cert_changed"
          no_log: true
          register: octoprint_cert_result
          changed_when: octoprint_cert_result.stdout is search('\bcert_changed\b')

        - name: Update HAProxy config
          ansible.builtin.raw: |
            if grep -qF "        bind :443 v4v6 ssl crt /etc/ssl/{{ cert_filename }}" /etc/haproxy/haproxy.cfg; then
              echo "cert_unchanged"
              exit 0
            fi
            sudo cp /etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg.bak
            sudo sed -i 's|^        bind :443.*|        bind :443 v4v6 ssl crt /etc/ssl/{{ cert_filename }}|' \
              /etc/haproxy/haproxy.cfg
            if sudo haproxy -f /etc/haproxy/haproxy.cfg -c > /dev/null 2>&1; then
              echo "cert_changed"
            else
              sudo mv /etc/haproxy/haproxy.cfg.bak /etc/haproxy/haproxy.cfg
              echo "validation_failed"
              exit 1
            fi
          register: octoprint_config_result
          changed_when: octoprint_config_result.stdout is search('\bcert_changed\b')
          failed_when: "'validation_failed' in octoprint_config_result.stdout"

        - name: Restart HAProxy
          ansible.builtin.raw: sudo systemctl restart haproxy
          when: octoprint_cert_result.changed or octoprint_config_result.changed


    - name: Deploy to Hyperion
      when: "'hyperion' in group_names"
      block:
        - name: Ensure cert directory
          ansible.builtin.file:
            path: /etc/ssl/letsencrypt
            state: directory
            mode: "0750"
            owner: hyperion
            group: hyperion

        - name: Copy certificates
          ansible.builtin.copy:
            content: "{{ item.content }}"
            dest: "{{ item.dest }}"
            mode: "0600"
            owner: hyperion
            group: hyperion
          no_log: true
          register: hyperion_cert_result
          loop:
            - {content: "{{ cert_fullchain }}", dest: "/etc/ssl/letsencrypt/fullchain.pem"}
            - {content: "{{ cert_key }}", dest: "/etc/ssl/letsencrypt/privkey.pem"}

        - name: Restart Hyperion
          ansible.builtin.systemd:
            name: hyperion@hyperion
            state: restarted
          when: not cert_before.matches
          async: 30
          poll: 0
          ignore_errors: true


    - name: Wait for services to stabilize
      ansible.builtin.pause:
        seconds: 10
      when: >
        (synology_cert_result.changed | default(false)) or
        (octoprint_cert_result.changed | default(false)) or
        (hyperion_cert_result.changed | default(false))


    - name: Verify certificate after deployment
      ansible.builtin.shell: |
        echo | openssl s_client -showcerts \
          -servername {{ certificate_hostname | default(ansible_host) }} \
          -connect {{ ansible_host }}:{{ certificate_port }} 2>/dev/null | \
          openssl x509
      delegate_to: localhost
      register: verify_cert
      changed_when: false
      failed_when: false

    - name: Verify certificate expiration after deployment
      ansible.builtin.shell: |
        echo | openssl s_client -showcerts \
          -servername {{ certificate_hostname | default(ansible_host) }} \
          -connect {{ ansible_host }}:{{ certificate_port }} 2>/dev/null | \
          openssl x509 -noout -enddate
      delegate_to: localhost
      register: verify_cert_expiry
      changed_when: false
      failed_when: false

    - name: Set post-deployment status
      ansible.builtin.set_fact:
        cert_after:
          matches: "{{ verify_cert.rc == 0 and (verify_cert.stdout | default('')) in cert_fullchain }}"
          expiry: >-
            {{ verify_cert_expiry.stdout.split('=')[1] | default('Unknown')
            if verify_cert_expiry.rc | default(1) == 0 else 'Unknown' }}
          reachable: "{{ verify_cert.rc | default(1) == 0 }}"
          deployed: >-
            {{ synology_cert_result.changed | default(false) or
               unifi_cert_result.changed | default(false) or
               octoprint_cert_result.changed | default(false) or
               hyperion_cert_result.changed | default(false) }}


- name: Generate and send report
  hosts: localhost
  gather_facts: true

  tasks:
    - name: Collect deployment results
      ansible.builtin.set_fact:
        deployment_results: >-
          {{ deployment_results | default({}) | combine({item: {
            'online': item in (groups['online'] | default([])),
            'cert_before': hostvars[item].cert_before | default(
              {'matches': false, 'expiry': 'Unknown', 'reachable': false}),
            'cert_after': hostvars[item].cert_after | default(
              {'matches': false, 'expiry': 'Unknown', 'reachable': false, 'deployed': false})
          }}) }}
      loop: "{{ groups['all'] }}"

    - name: Get email configuration
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: certificate-distribution-email
        namespace: cert-manager
      register: email_secret
      no_log: true
      failed_when: false

    - name: Send email report
      community.general.mail:
        host: "{{ email_secret.resources[0].data.host | b64decode }}"
        port: "{{ email_secret.resources[0].data.port | b64decode }}"
        username: "{{ email_secret.resources[0].data.username | b64decode }}"
        password: "{{ email_secret.resources[0].data.password | b64decode }}"
        to: "{{ email_secret.resources[0].data.to | b64decode }}"
        from: "{{ email_secret.resources[0].data.from | b64decode }}"
        subject: "Certificate Distribution Report - {{ ansible_date_time.date }}"
        secure: starttls
        subtype: html
        body: |
          <html>
          <head>
            <style>
              body { font-family: Arial, sans-serif; margin: 20px; }
              table { border-collapse: collapse; width: 100%; margin: 20px 0; }
              th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
              th { background-color: #4CAF50; color: white; }
              tr:nth-child(even) { background-color: #f2f2f2; }
              .success { color: #4CAF50; font-weight: bold; }
              .warning { color: #ff9800; font-weight: bold; }
              .error { color: #f44336; font-weight: bold; }
              .offline { color: #9e9e9e; font-weight: bold; }
            </style>
          </head>
          <body>
            <h2>Certificate Distribution Report</h2>
            <p><strong>Date:</strong> {{ ansible_date_time.iso8601 }}</p>
            <p><strong>Certificate:</strong> {{ cert_secret }} ({{ cert_namespace }} namespace)</p>

            <table>
              <tr>
                <th>Host</th>
                <th>Online</th>
                <th>Before</th>
                <th>Deployed</th>
                <th>After</th>
                <th>Expiration</th>
                <th>Status</th>
              </tr>
              {% for host in groups['all'] %}
              {% set r = deployment_results[host] %}
              <tr>
                <td>{{ host }}</td>
                <td>{{ '✓ Online' if r.online else '✗ Offline' }}</td>
                <td>{{ '✓ Current' if r.cert_before.matches else '✗ Outdated' }}</td>
                <td>{{ '✓ Yes' if r.cert_after.deployed else '— No change' }}</td>
                <td>{{ '✓ Verified' if r.cert_after.matches else ('— Skipped' if not r.online else '✗ Mismatch') }}</td>
                <td>{{ r.cert_after.expiry }}</td>
                <td class="{{ 'offline' if not r.online else ('success' if r.cert_after.matches else 'error') }}">
                  {{ 'OFFLINE' if not r.online else ('OK' if r.cert_after.matches else 'FAILED') }}
                </td>
              </tr>
              {% endfor %}
            </table>
          </body>
          </html>
      when: email_secret.resources | default([]) | length > 0
      failed_when: false
      register: email_result

    - name: Log email status
      ansible.builtin.debug:
        msg: >-
          Email report
          {{ 'sent successfully'
          if not (email_result.skipped | default(false)) and not (email_result.failed | default(false))
          else 'skipped — no email configuration found'
          if email_secret.resources | default([]) | length == 0
          else 'failed to send — check SMTP configuration' }}
