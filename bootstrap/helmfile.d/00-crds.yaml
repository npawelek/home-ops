---

# This helmfile is for extracting and installing Custom Resource Definitions (CRDs) from Helm charts.
# It is not intended to be used with helmfile apply or helmfile sync. Output is filtered to CRDs
# with yq in scripts/bootstrap-apps.sh (Helm 4 post-renderers must be plugins, not executables).

helmDefaults:
  args:
    - --include-crds
    - --no-hooks

bases:
  - templates/default.yaml

releases:
  - name: external-dns
    namespace: network
    inherit:
      - template: default

  - name: envoy
    namespace: gateway
    inherit:
      - template: default

  - name: prometheus-operator-crds
    namespace: monitoring
    inherit:
      - template: default
