# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.2.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dawarich
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      dawarich:
        type: deployment
        # RWO volumes shared by both containers; old pod must release them first
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          web:
            image: &image
              repository: docker.io/freikin/dawarich
              tag: 1.15.3@sha256:589e3606b11b61c3fa2d9661832cb73645a9b93a9cc7d807a071e2bc6c584498
            command: ["web-entrypoint.sh"]
            args: ["bin/rails", "server", "-p", "3000", "-b", "::"]
            env: &env
              - name: APPLICATION_HOSTS
                value: dawarich.${SECRET_DOMAIN}
              # Pod speaks plain HTTP; envoy terminates TLS. "https" turns on Rails force_ssl,
              # which 301s kubelet probes (no X-Forwarded-Proto header).
              - name: APPLICATION_PROTOCOL
                value: http
              - name: DOMAIN
                value: dawarich.${SECRET_DOMAIN}
              - name: RAILS_ENV
                value: production
              - name: RAILS_LOG_TO_STDOUT
                value: "true"
              - name: TIME_ZONE
                value: ${TIMEZONE}
              - name: SELF_HOSTED
                value: "true"
              - name: STORE_GEODATA
                value: "true"
              - name: DATABASE_HOST
                value: postgres-rw.database.svc.cluster.local
              - name: DATABASE_PORT
                value: "5432"
              - name: DATABASE_NAME
                value: dawarich
              # Shared Dragonfly: dedicated DB indexes keep keys apart from other tenants
              - name: RAILS_CACHE_DB
                value: "10"
              - name: RAILS_JOB_QUEUE_DB
                value: "11"
              - name: RAILS_WS_DB
                value: "12"
              - name: WEB_CONCURRENCY
                value: "1"
              - name: BACKGROUND_PROCESSING_CONCURRENCY
                value: "3"
              - name: SMTP_SERVER
                value: ${EMAIL_HOST}
              - name: SMTP_PORT
                value: "587"
              - name: SMTP_DOMAIN
                value: ${SECRET_DOMAIN}
              - name: SMTP_FROM
                value: ${EMAIL_FROM}
              - name: SMTP_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: cluster-secrets
                    key: EMAIL_USERNAME
              - name: SMTP_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: cluster-secrets
                    key: EMAIL_PASSWORD
              - name: SMTP_AUTHENTICATION
                value: login
              - name: SMTP_STARTTLS
                value: "true"
              # Authentik OIDC (terraform/authentik/dawarich.tf); OIDC_CLIENT_SECRET in dawarich-secrets.
              # OIDC turns on only once both client ID and secret are set.
              - name: OIDC_CLIENT_ID
                value: dawarich
              - name: OIDC_ISSUER
                value: https://auth.${SECRET_DOMAIN}/application/o/dawarich/
              - name: OIDC_REDIRECT_URI
                value: https://dawarich.${SECRET_DOMAIN}/users/auth/openid_connect/callback
              - name: OIDC_PROVIDER_NAME
                value: Authentik
              - name: OIDC_AUTO_REGISTER
                value: "true"
              - name: ALLOW_EMAIL_PASSWORD_LOGIN
                value: "false"
              - name: ALLOW_EMAIL_PASSWORD_REGISTRATION
                value: "false"
            envFrom: &envFrom
              - secretRef:
                  name: dawarich-secrets
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: &port 3000
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  # entrypoint runs migrations + seeds before Puma listens
                  periodSeconds: 10
                  failureThreshold: 60
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
          sidekiq:
            image: *image
            command: ["sidekiq-entrypoint.sh"]
            args: ["sidekiq"]
            env: *env
            envFrom: *envFrom
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["pgrep", "-f", "sidekiq"]
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: false
              startup:
                enabled: false
            securityContext: *securityContext
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: dawarich
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{.Release.Name}}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: gateway
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      storage:
        existingClaim: dawarich-storage
        globalMounts:
          - path: /var/app/storage
      # Drop-folder for auto-imports; unused (web uploads go to storage) but the watcher job needs the dir
      watched:
        type: emptyDir
        globalMounts:
          - path: /var/app/tmp/imports/watched
      # Static assets; web-entrypoint.sh recopies them from /var/app/public_dist on every start
      public:
        type: emptyDir
        globalMounts:
          - path: /var/app/public
      # Rails origin check vs gateway no-referrer; see resources/zz_disable_origin_check.rb
      initializers:
        type: configMap
        name: dawarich-initializers
        globalMounts:
          - path: /var/app/config/initializers/zz_disable_origin_check.rb
            subPath: zz_disable_origin_check.rb
            readOnly: true
