---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: internal-ca
  subject:
    organizations:
      - internal-ca
  privateKey:
    algorithm: ECDSA
    size: 384
  duration: 87600h
  renewBefore: 720h
  secretName: internal-ca
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
