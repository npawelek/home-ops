---
# For apps with their own replication (CNPG, etc.): single replica pinned to the pod's node
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  annotations:
    # Parameters are immutable; let Flux recreate the SC on change
    kustomize.toolkit.fluxcd.io/force: Enabled
  name: longhorn-local
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "2880"
  fsType: ext4
  dataEngine: v1
  dataLocality: strict-local
  # Single replica: nothing to balance
  replicaAutoBalance: disabled
  migratable: "false"
  encrypted: "false"
  disableRevisionCounter: "true"
  recurringJobSelector: '[{"name":"default","isGroup":true}]'
