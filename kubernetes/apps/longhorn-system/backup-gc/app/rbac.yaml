---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-backup-gc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: longhorn-backup-gc
rules:
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["get", "list"]
  - apiGroups: ["longhorn.io"]
    resources: ["backupvolumes"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: longhorn-backup-gc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: longhorn-backup-gc
subjects:
  - kind: ServiceAccount
    name: longhorn-backup-gc
