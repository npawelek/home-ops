---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: buzz
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  chartRef:
    kind: OCIRepository
    name: buzz
  interval: 1h
  values:
    image:
      repository: ghcr.io/block/buzz
      tag: 0.2.1
      digest: sha256:4e31b7c7abb7d00b6f513dc559e58d2b980416f1dc400aa01bcf762cf2989cfc

    relayUrl: wss://buzz.${SECRET_DOMAIN}
    ownerPubkey: 272692ebe590803f63402c7f1eaf404429cdc004f45cfa71493c6955ff79d695

    secrets:
      existingSecret: buzz-secrets

    postgresql:
      enabled: false
    redis:
      enabled: false
    minio:
      enabled: false

    s3:
      endpoint: https://minio.storage.svc.cluster.local:9000
      bucket: buzz
      region: us-east-1
      addressingStyle: path

    persistence:
      git:
        enabled: true
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 3Gi

    httproute:
      enabled: true
      parentRefs:
        - name: envoy-internal
          namespace: gateway
          sectionName: https
      hostnames:
        - buzz.${SECRET_DOMAIN}
        - buzz-admin.${SECRET_DOMAIN}

    serviceMonitor:
      enabled: true
      labels:
        monitoring: otel
      interval: 30s

    # internal-ca-bundle ConfigMap is distributed to this namespace by
    # trust-manager because the buzz namespace carries the ca-bundle: internal label.
    # An initContainer merges the Alpine system CA bundle with the internal CA into
    # a shared emptyDir, then SSL_CERT_FILE and the ca-certificates.crt mount cover
    # both native-tls (OpenSSL) and rustls-native-certs code paths.
    extraVolumes:
      - name: internal-ca
        configMap:
          name: internal-ca-bundle
      - name: shared-ca
        emptyDir: {}

    extraInitContainers:
      - name: ca-bundle
        # yamllint disable-line rule:line-length
        image: public.ecr.aws/docker/library/alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
        command:
          - /bin/sh
          - -c
          - |
            cp /etc/ssl/certs/ca-certificates.crt /shared/ca-bundle.crt
            cat /internal-ca/ca.crt >> /shared/ca-bundle.crt
        volumeMounts:
          - name: shared-ca
            mountPath: /shared
          - name: internal-ca
            mountPath: /internal-ca
            subPath: ca.crt

    relay:
      extraVolumeMounts:
        - name: shared-ca
          mountPath: /etc/ssl/certs/ca-certificates.crt
          subPath: ca-bundle.crt
      extraEnv:
        - name: SSL_CERT_FILE
          value: /etc/ssl/certs/ca-certificates.crt
        - name: BUZZ_ADMIN_HOST
          value: buzz-admin.${SECRET_DOMAIN}
        - name: RELAY_OPERATOR_PUBKEYS
          value: 272692ebe590803f63402c7f1eaf404429cdc004f45cfa71493c6955ff79d695
        - name: RELAY_OPERATOR_API_ORIGIN
          value: https://buzz.${SECRET_DOMAIN}
