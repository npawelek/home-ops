---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: buzz
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  chartRef:
    kind: OCIRepository
    name: buzz
  interval: 1h
  values:
    image:
      repository: ghcr.io/block/buzz
      tag: 0.2.1
      digest: sha256:4e31b7c7abb7d00b6f513dc559e58d2b980416f1dc400aa01bcf762cf2989cfc

    relayUrl: wss://buzz.${SECRET_DOMAIN}
    ownerPubkey: 272692ebe590803f63402c7f1eaf404429cdc004f45cfa71493c6955ff79d695

    pairingRelay:
      enabled: true
      url: wss://buzz.${SECRET_DOMAIN}/pair

    secrets:
      existingSecret: buzz-secrets

    postgresql:
      enabled: false
    redis:
      enabled: false
    minio:
      enabled: false

    s3:
      endpoint: https://s3.${SECRET_DOMAIN}
      bucket: buzz
      region: us-east-1
      addressingStyle: path

    migrate:
      autoMigrate: true
      preUpgradeJob:
        enabled: true

    persistence:
      git:
        enabled: true
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 3Gi

    httproute:
      enabled: true
      parentRefs:
        - name: envoy-internal
          namespace: gateway
          sectionName: https
      hostnames:
        - buzz.${SECRET_DOMAIN}
        - buzz-admin.${SECRET_DOMAIN}

    serviceMonitor:
      enabled: true
      labels:
        monitoring: otel
      interval: 30s

    relay:
      requireAuthToken: true
      requireRelayMembership: true
      allowNipOaAuth: true
      corsOrigins:
        - https://buzz.${SECRET_DOMAIN}
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
      extraEnv:
        - name: BUZZ_ADMIN_HOST
          value: buzz-admin.${SECRET_DOMAIN}
        - name: RELAY_OPERATOR_PUBKEYS
          value: 272692ebe590803f63402c7f1eaf404429cdc004f45cfa71493c6955ff79d695
        - name: RELAY_OPERATOR_API_ORIGIN
          value: https://buzz.${SECRET_DOMAIN}
        - name: RUST_LOG
          value: buzz_relay=info,buzz_db=info,buzz_auth=info,buzz_pubsub=info,tower_http=info
