---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
  interval: 1h
  values:
    serviceMonitor:
      create: false
    web:
      config:
        baseURL: https://flux.${SECRET_DOMAIN}
        authentication:
          type: OAuth2
          oauth2:
            provider: OIDC
            clientID: flux-web
            issuerURL: https://auth.${SECRET_DOMAIN}/application/o/flux/
            scopes:
              - openid
              - profile
              - email
            autoLogin: true
      httpRoute:
        enabled: true
        hostnames:
          - flux.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: gateway
            sectionName: https
  valuesFrom:
    - kind: Secret
      name: flux-web-client
      valuesKey: client-secret
      targetPath: web.config.authentication.oauth2.clientSecret
