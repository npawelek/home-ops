---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
spec:
  chartRef:
    kind: OCIRepository
    name: tofu-controller
  interval: 1h
  values:
    replicaCount: 2
    concurrency: 24
    allowCrossNamespaceRefs: true

    image:
      repository: ghcr.io/flux-iac/tofu-controller
      tag: v0.16.6@sha256:02912fc1b79f30a56f67ad2b131e385367eb702c92915faf1457cd17506b56cd

    runner:
      image:
        repository: ghcr.io/home-operations/opentofu-runner
        tag: 1.13.2@sha256:9bf98a36cfa5511412cc5e75ba0b6835ecc0b02e9426054c67c50000b4702e60
      grpc:
        maxMessageSize: 30
      resources:
        limits:
          cpu: 1000m
          memory: 2Gi
        requests:
          cpu: 400m
          memory: 64Mi

    metrics:
      enabled: true

    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      seccompProfile:
        type: RuntimeDefault
