---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
spec:
  chartRef:
    kind: OCIRepository
    name: tofu-controller
  interval: 1h
  values:
    replicaCount: 2
    concurrency: 24
    allowCrossNamespaceRefs: true

    image:
      repository: ghcr.io/flux-iac/tofu-controller
      tag: v0.17.0@sha256:0bda307fe93e9707d66224be44fbcc0e050c6c4533f449390b9ad81ed2201331

    runner:
      image:
        repository: ghcr.io/home-operations/opentofu-runner
        tag: 1.13.9@sha256:63cc8e21c5d115b877bd65544c7b0529464888dc12fd511ddaeb2ae0e3bd18f0
      grpc:
        maxMessageSize: 30
      resources:
        limits:
          cpu: 1000m
          memory: 2Gi
        requests:
          cpu: 400m
          memory: 64Mi

    metrics:
      enabled: true

    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      seccompProfile:
        type: RuntimeDefault
