model:
  default: claude-opus-5-5
  provider: claude-subscription-directsdk-experimental
fallback_providers:
  - provider: custom:ollama-local
    model: ${OLLAMA_MODEL}
providers:
  custom:ollama-local:
    api: http://ollama.network.svc.cluster.local:11434/v1
    name: ollama-local
    api_key: ollama
    default_model: ${OLLAMA_MODEL}
    models:
      ${OLLAMA_MODEL}:
        context_length: 131072
platform_toolsets:
  buzz:
    - camofox
    - clarify
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - web
known_plugin_toolsets:
  buzz:
    - camofox
  webhook:
    - camofox
plugins:
  disabled: []
  enabled:
    - camofox
  auto_update_check_hours: 0
  entries:
    claude-subscription-directsdk-experimental:
      settings:
        extra_usage: notify
        max_concurrent: 6
        claude_code_telemetry: false
skills:
  external_dirs:
    - /opt/hermes/skills
    - /opt/hermes/optional-skills/media/gif-search
    - /opt/hermes/optional-skills/software-development/hermes-agent-skill-authoring
    - /opt/hermes/optional-skills/software-development/inspecting-hermes-desktop-dom
    - /opt/hermes/optional-skills/software-development/node-inspect-debugger
    - /opt/hermes/optional-skills/software-development/python-debugpy
    - /opt/data/repos/home-ops/.agents/skills
  disabled:
    - apple-notes
    - apple-reminders
    - arxiv
    - ascii-video
    - baoyu-infographic
    - claude-code
    - claude-design
    - codebase-inspection
    - codex
    - computer-use
    - dogfood
    - email-inbox-triage
    - findmy
    - google-workspace
    - himalaya
    - imessage
    - manim-video
    - meeting-action-items
    - obsidian
    - p5js
    - popular-web-designs
    - teams-meeting-pipeline
    - test-driven-development
    - weekly-review-planning
    - xurl
agent:
  max_turns: 60
  run_budget_seconds: 3600
  restart_drain_timeout: 60
  reasoning_effort: medium
  disabled_toolsets:
    - browser
    - code_execution
    - computer_use
    - connections
    - cronjob
    - delegation
    - homeassistant
    - spotify
    - stt
    - tts
    - vision
browser:
  cloud_provider: camofox
  camofox:
    managed_persistence: true
terminal:
  backend: local
  cwd: /opt/data/workspace
  home_mode: real
compression:
  threshold_tokens: 275000
display:
  platforms:
    buzz:
      interim_assistant_messages: false
      tool_progress: 'off'
memory:
  provider: memini
  user_profile_enabled: true
auxiliary:
  title_generation:
    model_upgrade_enabled: false
security:
  allow_private_urls: true
  redact_secrets: true
approvals:
  mode: smart
web:
  search_backend: searxng
  keyless_fallback: false
  keyless_rescue: false
kanban:
  max_in_progress: 4
nous:
  guest: false
tools:
  connectors:
    enabled: false
auth:
  adopt_external_logins: false
privacy:
  redact_pii: true
telemetry:
  shared_metrics:
    enabled: false
    offer_version: 2
    send: false
updates:
  check: false
model_catalog:
  enabled: false
dashboard:
  public_url: https://hermes.${SECRET_DOMAIN}
  oauth:
    provider: self-hosted
    self_hosted:
      issuer: https://auth.${SECRET_DOMAIN}/application/o/hermes-dashboard/
      client_id: hermes-dashboard
  theme: mono
gateway:
  message_timestamps:
    enabled: true
  platforms:
    buzz:
      enabled: true
      extra:
        require_mention: true
        allow_all_users: false
_config_version: 54
_left_core_installed:
  - camofox
_left_core_scoped:
  - camofox
_left_core_used:
  - camofox
