# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  timeout: 20m
  values:
    defaultPodOptions:
      terminationGracePeriodSeconds: 90
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      hermes:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init:
            image: &app_image
              repository: nousresearch/hermes-agent
              # renovate: datasource=docker depName=nousresearch/hermes-agent
              tag: v0.23.3@sha256:3e9fe4c6ef36490f43aa0d0d80f9df64e9c92a576eee3042f1a97c8813c05355
            env:
              HOME: /opt/data
              HERMES_HOME: /opt/data
              # renovate: datasource=github-releases depName=jdx/mise
              MISE_VERSION: v2026.11.11
              MISE_INSTALL_PATH: /opt/data/.local/bin/mise
              MISE_INSTALL_SKIP_IF_EXISTS: "1"
              MISE_YES: "1"
              HTTP_PROXY: ${HTTP_PROXY}
              HTTPS_PROXY: ${HTTPS_PROXY}
              NO_PROXY: ${NO_PROXY}
              http_proxy: ${HTTP_PROXY}
              https_proxy: ${HTTPS_PROXY}
              no_proxy: ${NO_PROXY}
            envFrom:
              - secretRef:
                  name: hermes-github-app
              - secretRef:
                  name: hermes-github-config
              - secretRef:
                  name: hermes-signing-key
            command:
              - bash
              - /run/config/init.sh
        containers:
          app:
            image: *app_image
            args:
              - gateway
              - run
            env:
              TZ: ${TIMEZONE}
              HOME: /opt/data
              HERMES_HOME: /opt/data
              HERMES_UID: "1000"
              HERMES_GID: "1000"
              CAMOFOX_URL: http://camofox.ai.svc.cluster.local:9377
              SEARXNG_URL: http://searxng.network.svc.cluster.local:8080
              S6_SERVICES_GRACETIME: "75000"
              S6_KILL_GRACETIME: "75000"
              HERMES_DASHBOARD: "1"
              HTTP_PROXY: ${HTTP_PROXY}
              HTTPS_PROXY: ${HTTPS_PROXY}
              NO_PROXY: ${NO_PROXY}
              http_proxy: ${HTTP_PROXY}
              https_proxy: ${HTTPS_PROXY}
              no_proxy: ${NO_PROXY}
              DO_NOT_TRACK: "1"
              GH_TELEMETRY: "false"
              DISABLE_TELEMETRY: "1"
              DISABLE_ERROR_REPORTING: "1"
              DISABLE_AUTOUPDATER: "1"
              # yamllint disable-line rule:line-length
              PATH: /opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/opt/data/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            envFrom:
              - secretRef:
                  name: hermes-github-config
            resources:
              requests:
                cpu: 250m
                memory: 2Gi
              limits:
                memory: 8Gi
    service:
      app:
        controller: hermes
        ports:
          http:
            port: 9119
    route:
      app:
        hostnames:
          - hermes.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: gateway
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 9119
    persistence:
      data:
        existingClaim: hermes-data
        globalMounts:
          - path: /opt/data
      config:
        type: configMap
        name: hermes-configmap
        defaultMode: 0644
        advancedMounts:
          hermes:
            init:
              - path: /run/config/mise.toml
                subPath: mise.toml
              - path: /run/config/init.sh
                subPath: init.sh
              - path: /run/config/git-init.sh
                subPath: git-init.sh
      hermes-config:
        type: configMap
        name: hermes-config
        defaultMode: 0644
        advancedMounts:
          hermes:
            init:
              - path: /run/config/config.yaml
                subPath: config.yaml
      profiles-env:
        type: secret
        name: hermes-env-profile
        defaultMode: 0400
        advancedMounts:
          hermes:
            init:
              - path: /run/secrets/hermes-profiles
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
