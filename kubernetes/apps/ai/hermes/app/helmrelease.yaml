# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.2.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  timeout: 20m
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        initContainers:
          init:
            image: &app_image
              repository: nousresearch/hermes-agent
              # renovate: datasource=docker depName=nousresearch/hermes-agent
              tag: v0.21.6@sha256:55e192fba0cd4fde61142abbff5adeacff40efdb482ccd0ff877924bd274f909
            env:
              HOME: /opt/data
              HERMES_HOME: /opt/data
              # renovate: datasource=github-releases depName=jdx/mise
              MISE_VERSION: v2026.10.7
              MISE_INSTALL_PATH: /opt/data/.local/bin/mise
              MISE_INSTALL_SKIP_IF_EXISTS: "1"
              MISE_YES: "1"
            envFrom:
              - secretRef:
                  name: hermes-github-app
              - secretRef:
                  name: hermes-github-config
              - secretRef:
                  name: hermes-signing-key
            command:
              - bash
              - /run/config/init.sh
        containers:
          app:
            image: *app_image
            args:
              - gateway
              - run
            env:
              TZ: ${TIMEZONE}
              HOME: /opt/data
              HERMES_HOME: /opt/data
              HERMES_UID: "1000"
              HERMES_GID: "1000"
              CAMOFOX_URL: http://camofox.ai.svc.cluster.local:9377
              SEARXNG_URL: http://searxng.network.svc.cluster.local:8080
              # yamllint disable-line rule:line-length
              PATH: /opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/opt/data/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            envFrom:
              - secretRef:
                  name: hermes-github-config
            resources:
              requests:
                cpu: 250m
                memory: 2Gi
              limits:
                memory: 8Gi
    service:
      app:
        controller: hermes
        ports:
          gateway:
            port: 8642
          dashboard:
            port: 9119
    persistence:
      data:
        existingClaim: hermes-data
        globalMounts:
          - path: /opt/data
      config:
        type: configMap
        name: hermes-configmap
        defaultMode: 0644
        advancedMounts:
          hermes:
            init:
              - path: /run/config/config.yaml
                subPath: config.yaml
              - path: /run/config/mise.toml
                subPath: mise.toml
              - path: /run/config/init.sh
                subPath: init.sh
              - path: /run/config/git-init.sh
                subPath: git-init.sh
      profiles-env:
        type: secret
        name: hermes-env-profile
        defaultMode: 0400
        advancedMounts:
          hermes:
            init:
              - path: /run/secrets/hermes-profiles
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
