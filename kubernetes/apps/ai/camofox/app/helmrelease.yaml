# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app camofox
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    defaultPodOptions:
      terminationGracePeriodSeconds: 60
      securityContext:
        # The published image (Dockerfile.ci) bakes the browser into /root/.cache/camoufox (mode 0700).
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/jo-inc/camofox-browser
              # renovate: datasource=docker depName=ghcr.io/jo-inc/camofox-browser
              tag: 1.19.0@sha256:49f8e02f9fb0e191b406845482745efc72f835db06789e3a34e77a6ff1497046
            env:
              TZ: ${TIMEZONE}
              CAMOFOX_PORT: &port 9377
              CAMOFOX_BIND_HOST: 0.0.0.0
              CAMOFOX_PROFILE_DIR: /data/profiles
              CAMOFOX_COOKIES_DIR: /data/cookies
              CAMOFOX_UPLOADS_DIR: /data/uploads
              CAMOFOX_TRACES_DIR: /data/traces
              CAMOFOX_CRASH_REPORT_ENABLED: "false"
              MAX_OLD_SPACE_SIZE: "1024"
              ENABLE_VNC: "1"
              VNC_RESOLUTION: 1920x1080
              # websockify defaults to 127.0.0.1; bind to all interfaces so the
              # HTTPRoute can reach it.
              VNC_BIND: 0.0.0.0
              NOVNC_PORT: &vnc_port 6080
              PROXY_PROTOCOL: http
              PROXY_HOST: ${PROXY_LB}
              PROXY_PORT: "8888"
              HTTP_PROXY: ${HTTP_PROXY}
              HTTPS_PROXY: ${HTTPS_PROXY}
              NO_PROXY: ${NO_PROXY}
              http_proxy: ${HTTP_PROXY}
              https_proxy: ${HTTPS_PROXY}
              no_proxy: ${NO_PROXY}
            envFrom:
              - secretRef:
                  name: camofox-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
          vnc:
            port: *vnc_port
    route:
      camofox:
        hostnames:
          - camofox.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: gateway
            sectionName: https
        rules:
          - matches:
              - path:
                  type: Exact
                  value: /
            filters:
              - type: URLRewrite
                urlRewrite:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /vnc.html
            backendRefs:
              - identifier: app
                port: *vnc_port
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: *vnc_port
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
