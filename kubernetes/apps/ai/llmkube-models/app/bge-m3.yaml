---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: bge-m3
spec:
  format: gguf
  quantization: Q8_0
  # yamllint disable-line rule:line-length
  source: https://huggingface.co/ggml-org/bge-m3-Q8_0-GGUF/resolve/9eba04c5d75ba5a1595e45de734d36bef4e5cb98/bge-m3-q8_0.gguf
  sha256: aa473d51f451a22f0fcf39ba3330c14bed38a385712b1113440f69df4047a173
  hardware:
    accelerator: vulkan
    gpu:
      enabled: true
      count: 1
      layers: -1
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llmkube-models-gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: bge-m3
spec:
  modelRef: bge-m3
  mode: embedding
  runtime: llamacpp
  # yamllint disable-line rule:line-length
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b12602@sha256:7e40bc3d631ec7f071aa2e320d8b12ea83a9405871df7a3984b3f71f196e59f3
  replicas: 1
  priority: batch
  podSecurityContext:
    fsGroup: 102
  contextSize: 8192
  parallelSlots: 2
  batchSize: 8192
  uBatchSize: 4096
  resources:
    cpu: 100m
    memory: 2Gi
  extraArgs:
    - --pooling
    - cls
    - --cache-ram
    - "0"
    - --sleep-idle-seconds
    - "300"
    - --alias
    - bge-m3
    - --metrics
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 60
    liveness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 30
      failureThreshold: 3
    readiness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 3
