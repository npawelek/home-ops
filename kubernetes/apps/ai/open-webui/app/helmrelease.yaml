# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.13.4@sha256:d5168bfbc28609eff5bea1b438dd864cf64d185cf6582c02244865e18385b901
            env:
              TZ: ${TIMEZONE}
              OLLAMA_BASE_URL: http://ollama.network.svc.cluster.local:11434
              WEBUI_URL: https://{{.Release.Name}}.${SECRET_DOMAIN}
              ENABLE_VERSION_UPDATE_CHECK: "false"
              OAUTH_PROVIDER_NAME: authentik
              OAUTH_CLIENT_ID: open-webui
              # yamllint disable-line rule:line-length
              OPENID_PROVIDER_URL: https://auth.${SECRET_DOMAIN}/application/o/open-webui/.well-known/openid-configuration
              OPENID_REDIRECT_URI: https://{{.Release.Name}}.${SECRET_DOMAIN}/oauth/oidc/callback
              ENABLE_OAUTH_SIGNUP: "true"
              ENABLE_LOGIN_FORM: "false"
              OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
              OAUTH_AUTO_REDIRECT: "true"
              ENABLE_PERSISTENT_CONFIG: "false"
              DEFAULT_MODEL_METADATA: '{"capabilities":{"web_search":true},"defaultFeatureIds":["web_search"]}'
              RAG_TOP_K: "3"
              RAG_TOP_K_RERANKER: "3"
              CHUNK_SIZE: "1000"
              ENABLE_WEB_SEARCH: "true"
              WEB_SEARCH_ENGINE: searxng
              SEARXNG_QUERY_URL: http://searxng.network.svc.cluster.local:8080/search?q=<query>
              ENABLE_COMMUNITY_SHARING: "false"
              ENABLE_EVALUATION_ARENA_MODELS: "false"
              ENABLE_OPENAI_API: "false"
              HTTP_PROXY: ${HTTP_PROXY}
              HTTPS_PROXY: ${HTTPS_PROXY}
              NO_PROXY: ${NO_PROXY}
              http_proxy: ${HTTP_PROXY}
              https_proxy: ${HTTPS_PROXY}
              no_proxy: ${NO_PROXY}
            envFrom:
              - secretRef:
                  name: open-webui-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 1Gi
              limits:
                memory: 2Gi
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{.Release.Name}}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: gateway
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        existingClaim: open-webui-data
        globalMounts:
          - path: /app/backend/data
