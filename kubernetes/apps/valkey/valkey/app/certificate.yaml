---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: valkey-tls
  namespace: valkey
spec:
  secretName: valkey-tls
  commonName: valkey.valkey.svc.cluster.local
  dnsNames:
    - valkey
    - valkey.valkey.svc
    - valkey.valkey.svc.cluster.local
  privateKey:
    algorithm: ECDSA
    size: 384
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
