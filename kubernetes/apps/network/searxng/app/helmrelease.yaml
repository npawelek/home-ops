# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: searxng
spec:
  chartRef:
    kind: OCIRepository
    name: searxng
  interval: 1h
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      searxng:
        annotations:
          reloader.stakater.com/auto: "true"
        type: deployment
        replicas: 2
        strategy: RollingUpdate
        initContainers:
          config-init:
            image:
              repository: public.ecr.aws/docker/library/alpine
              tag: 3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
            command:
              - /bin/sh
              - -c
              - |
                sed \
                  -e "s|\$${BRAVE_API_KEY}|$${BRAVE_API_KEY}|g" \
                  -e "s|\$${KAGI_API_KEY}|$${KAGI_API_KEY}|g" \
                  /tmp/settings-template/settings.yml \
                  > /etc/searxng/settings.yml
            envFrom:
              - secretRef:
                  name: searxng-secret
        containers:
          app:
            image:
              repository: ghcr.io/searxng/searxng
              tag: 2026.9.8-3fdc6d753@sha256:3547509b419cd6a67333d6d68bd1ffad8d46d3669d82e7a7bd538f7b45827432
            env:
              TZ: ${TIMEZONE}
              http_proxy: ${HTTP_PROXY}
              https_proxy: ${HTTPS_PROXY}
              no_proxy: ${NO_PROXY}
              SEARXNG_BASE_URL: "https://{{.Release.Name}}.${SECRET_DOMAIN}"
              SEARXNG_PORT: &port 8080
            envFrom:
              - secretRef:
                  name: searxng-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - "ALL"
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2048Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 977
        runAsGroup: 977
        fsGroup: 977
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      config:
        type: configMap
        name: "{{.Release.Name}}-configmap"
        advancedMounts:
          searxng:
            config-init:
              - path: /tmp/settings-template/settings.yml
                subPath: settings.yml
                readOnly: true
            app:
              - path: /etc/searxng/limiter.toml
                subPath: limiter.toml
                readOnly: true
      config-processed:
        type: emptyDir
        advancedMounts:
          searxng:
            config-init:
              - path: /etc/searxng
            app:
              - path: /etc/searxng
      ca-bundle:
        type: configMap
        name: internal-ca-bundle
        globalMounts:
          - path: /etc/ssl/certs/ca.crt
            subPath: ca.crt
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{.Release.Name}}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: gateway
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
