# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  chartRef:
    kind: OCIRepository
    name: minio
  interval: 1h
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      minio:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        defaultContainerOptions:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
        applyDefaultContainerOptionsToInitContainers: true
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1024
            runAsGroup: 100
            fsGroup: 100
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          license:
            image:
              repository: public.ecr.aws/docker/library/alpine
              tag: 3.21.3
            command:
              - /bin/sh
              - -c
              - |
                if [ -f /data/.minio.license ] && [ "$(cat /data/.minio.license)" != "$MINIO_LICENSE" ]; then
                  exit 0
                fi
                printf '%s' "$MINIO_LICENSE" > /data/.minio.license
            env:
              MINIO_LICENSE:
                valueFrom:
                  secretKeyRef:
                    name: minio-secrets
                    key: MINIO_LICENSE
        containers:
          app:
            image:
              repository: quay.io/minio/aistor/minio
              # yamllint disable-line rule:line-length
              # renovate: datasource=docker depName=quay.io/minio/aistor/minio versioning=regex:^RELEASE\\.(?<major>\\d+)-(?<minor>\\d+)-(?<patch>\\d+)T\\d+-\\d+-\\d+Z$
              tag: RELEASE.2026-08-07T18-34-35Z@sha256:d1eb0f79ced75d6c024fc6a2ab6a7b3629ff54c798d967d9c6f89951237480a7
            command:
              - /usr/bin/minio
            args:
              - server
              - /data
              - --console-address
              - :9001
              - --certs-dir
              - /etc/minio/certs
              - --license
              - /data/.minio.license
            env:
              TZ: ${TIMEZONE}
              MINIO_CALLHOME_ENABLE: "off"
              MINIO_SITE_NAME: MinIO
              MINIO_SITE_REGION: us-east-1
              MINIO_PROMETHEUS_AUTH_TYPE: public
              # yamllint disable-line rule:line-length
              MINIO_IDENTITY_OPENID_CONFIG_URL: https://auth.${SECRET_DOMAIN}/application/o/minio/.well-known/openid-configuration
              MINIO_IDENTITY_OPENID_CLIENT_ID: minio
              MINIO_IDENTITY_OPENID_SCOPES: openid,profile,email,minio
              MINIO_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC: "on"
              MINIO_IDENTITY_OPENID_CLAIM_NAME: policy
              MINIO_IDENTITY_OPENID_CLAIM_USERINFO: "on"
              MINIO_IDENTITY_OPENID_DISPLAY_NAME: Authentik
            envFrom:
              - secretRef:
                  name: minio-secrets
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /minio/health/live
                    scheme: HTTPS
                    port: 9000
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /minio/health/ready
                    scheme: HTTPS
                    port: 9000
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi

    service:
      app:
        controller: minio
        ports:
          s3api:
            port: 9000
          console:
            port: 9001

    serviceMonitor:
      app:
        enabled: true
        labels:
          monitoring: otel
        service:
          identifier: app
        endpoints:
          - port: s3api
            interval: 30s
            path: /minio/v2/metrics/cluster
            scheme: https
            tlsConfig:
              ca:
                configMap:
                  name: internal-ca-bundle
                  key: ca.crt
              serverName: minio.storage.svc.cluster.local

    route:
      minio:
        parentRefs:
          - name: envoy-internal
            namespace: gateway
            sectionName: https
        hostnames:
          - minio.${SECRET_DOMAIN}
        rules:
          - backendRefs:
              - identifier: app
                port: 9001
      s3:
        parentRefs:
          - name: envoy-internal
            namespace: gateway
            sectionName: https
        hostnames:
          - s3.${SECRET_DOMAIN}
        rules:
          - backendRefs:
              - identifier: app
                port: 9000

    persistence:
      data:
        existingClaim: racknas-minio
        globalMounts:
          - path: /data
      tls:
        type: secret
        name: minio-tls
        advancedMounts:
          minio:
            app:
              - path: /etc/minio/certs/public.crt
                subPath: tls.crt
                readOnly: true
              - path: /etc/minio/certs/private.key
                subPath: tls.key
                readOnly: true
      ca-bundle:
        type: configMap
        name: internal-ca-bundle
        globalMounts:
          - path: /etc/ssl/certs/ca.crt
            subPath: ca.crt
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      minio-home:
        type: emptyDir
        globalMounts:
          - path: /home/minio/.minio
