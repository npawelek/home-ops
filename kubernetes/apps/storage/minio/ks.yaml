---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app minio
spec:
  targetNamespace: storage
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: nfs-volumes
    - name: nfs-pvc-storage
    - name: trust-manager-bundle
      namespace: cert-manager
  path: ./kubernetes/apps/storage/minio/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      BACKEND_TLS_HOSTNAME: minio.storage.svc.cluster.local
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  components:
    - ../../../../components/backend-tls
