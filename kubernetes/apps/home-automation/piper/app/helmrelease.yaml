# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: piper
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      piper:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: rhasspy/wyoming-piper
              tag: 2.5.2@sha256:7d39aafac409c2b6b09d999ed04d84c311d632e558b35baa60fad6aac722af7a
            args:
              - --voice
              - en_US-libritts_r-medium
            env:
              TZ: ${TIMEZONE}
            resources:
              requests:
                memory: 250Mi
                cpu: 200m
              limits:
                memory: 500Mi
    service:
      piper:
        controller: piper
        ports:
          http:
            port: 10200
            protocol: TCP
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: piper-data
        globalMounts:
          - path: /data
