# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      mosquitto:
        type: statefulset
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-auth:
            image:
              repository: public.ecr.aws/docker/library/alpine
              tag: 3.24.4@sha256:93b41ef40b1677fce8fcc64ff4af09daddfacf5040afde618bc46c1e2d1cc7d4
            command:
              - /bin/sh
              - -c
              - |
                cp /tmp/auth/passwd /mosquitto/configinc/auth/passwd
                cp /tmp/auth/acl /mosquitto/configinc/auth/acl
                chmod 0700 /mosquitto/configinc/auth/passwd /mosquitto/configinc/auth/acl
                chown 1883:1883 /mosquitto/configinc/auth/passwd /mosquitto/configinc/auth/acl
        containers:
          app:
            image:
              repository: public.ecr.aws/docker/library/eclipse-mosquitto
              tag: 2.1.2-alpine@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
            env:
              TZ: ${TIMEZONE}
            resources:
              requests:
                cpu: 15m
                memory: 128Mi
              limits:
                memory: 256Mi
    service:
      mosquitto:
        controller: mosquitto
        type: LoadBalancer
        annotations:
          metallb.io/loadBalancerIPs: ${MOSQUITTO_LB}
        externalTrafficPolicy: Local
        ports:
          mqtt:
            port: 1883
            protocol: TCP
          mqtts:
            port: 8883
            protocol: TCP
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: mosquitto-data
        globalMounts:
          - path: /mosquitto/data
      configinc:
        type: configMap
        name: mosquitto-conf
        globalMounts:
          - path: /mosquitto/config/mosquitto.conf
            subPath: mosquitto.conf
          - path: /mosquitto/configinc/mqtt.conf
            subPath: mqtt.conf
      mosquitto-auth:
        type: secret
        name: mosquitto-secrets
        advancedMounts:
          mosquitto:
            init-auth:
              - path: /tmp/auth
                readOnly: true
      mosquitto-auth-rw:
        type: emptyDir
        globalMounts:
          - path: /mosquitto/configinc/auth
      mosquitto-tls:
        type: secret
        name: mqtt-${OLD_SECRET_DOMAIN/./-}-tls
        globalMounts:
          - path: /etc/ssl/mosquitto
            readOnly: true
