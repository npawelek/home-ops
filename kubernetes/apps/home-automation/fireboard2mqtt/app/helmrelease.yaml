# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fireboard2mqtt
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      fireboard2mqtt:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/gordlea/fireboard2mqtt
              tag: 3.3.0@sha256:0fba333ce2f7d83026d8177cff563c970ddf3522cbfc982f8a26dec742cc8762
            env:
              TZ: ${TIMEZONE}
              RUST_LOG: fireboard2mqtt=debug
              FB2MQTT_FIREBOARD_ENABLE_DRIVE: "true"
              FB2MQTT_MQTT_BASE_TOPIC: homeassistant/fireboard2mqtt
            envFrom:
              - secretRef:
                  name: fireboard2mqtt-secrets
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
    service:
      app:
        controller: fireboard2mqtt
        enabled: false
