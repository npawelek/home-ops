---
apiVersion: batch/v1
kind: Job
metadata:
  name: role-settings-kept
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          # yamllint disable-line rule:line-length
          image: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie@sha256:b98ae0b74a12f20ccff32219be0e33fdd35c7e2e8e73c8bff9173f1128e167d1
          env:
            - name: PGHOST
              value: postgres-rw.database.svc.cluster.local
            - name: PGSSLMODE
              value: require
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: kept
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: credentials-admin
                  key: password
          command:
            - psql
            - -v
            - ON_ERROR_STOP=1
            - -c
            - ALTER ROLE kept_app SET statement_timeout = '15s'
            - -c
            - ALTER ROLE kept_app SET idle_in_transaction_session_timeout = '30s'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
