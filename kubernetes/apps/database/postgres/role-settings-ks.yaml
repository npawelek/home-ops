---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: database-postgres-role-settings
  namespace: database
spec:
  interval: 1h
  path: ./kubernetes/apps/database/postgres/role-settings
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: true
  dependsOn:
    - name: database-postgres-databases
