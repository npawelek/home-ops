---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: dawarich
spec:
  cluster:
    name: postgres
  name: dawarich
  owner: dawarich
  # postgis is untrusted: must be created by the operator (superuser), not the app role
  extensions:
    - name: postgis
      ensure: present
      # CNPG runs ALTER EXTENSION ... UPDATE TO when this changes; Renovate bumps it with the image in app/cluster.yaml
      # yamllint disable-line rule:line-length
      # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgis-extension extractVersion=^(?<version>\d+\.\d+\.\d+)-18-trixie$
      version: 3.6.4
    - name: pgcrypto
      ensure: present
