---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 3
  # yamllint disable-line rule:line-length
  imageName: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie@sha256:37ade18dbdddba430858c72725aceeec66f33fa5333e82ea1df4942f6c1c83a3
  primaryUpdateStrategy: unsupervised
  startDelay: 300

  postgresql:
    extensions:
      - name: vchord
        image:
          # yamllint disable-line rule:line-length
          reference: ghcr.io/jdijt/cnpg-vchord:1.1.1-20260823082441-18-trixie@sha256:93991656e82d43cff9713e14670723f35dec0433436a5a8c8b91a549d1704a7f
      # PostGIS for dawarich; bundles GEOS/PROJ/GDAL under /system (absent from minimal base)
      - name: postgis
        image:
          # yamllint disable-line rule:line-length
          reference: ghcr.io/cloudnative-pg/postgis-extension:3.6.4-18-trixie@sha256:eb05b5ec9ce608d7eb516b482a36d32fb32500d2f7a743255fb98760f02a3022
        ld_library_path:
          - system
    shared_preload_libraries:
      - "vchord.so"
    parameters:
      # Autovacuum tuning for photo metadata workloads
      autovacuum_vacuum_scale_factor: "0.1"
      autovacuum_analyze_scale_factor: "0.05"
      autovacuum_vacuum_cost_limit: "1000"
      # Connection and memory
      max_connections: "300"
      shared_buffers: "512MB"
      effective_cache_size: "2GB"
      maintenance_work_mem: "128MB"
      work_mem: "16MB"
      # Checkpoints and WAL
      checkpoint_completion_target: "0.9"
      wal_buffers: "32MB"
      wal_compression: "on"
      min_wal_size: "1GB"
      max_wal_size: "5GB"
      # Query planning
      default_statistics_target: "100"
      random_page_cost: "1.0"
      effective_io_concurrency: "200"
      # Logging
      log_statement: "none"
      log_min_duration_statement: "500"
      # Security
      password_encryption: "scram-sha-256"
      ssl_min_protocol_version: "TLSv1.2"
      # Schema
      search_path: '"$user", public'

    pg_hba:
      - local all all scram-sha-256
      - hostssl all all 127.0.0.1/32 scram-sha-256
      - hostssl all all ::1/128 scram-sha-256
      - hostssl all all 10.32.0.0/12 scram-sha-256
      - hostssl all all 192.168.0.0/24 scram-sha-256
      - hostssl all all 192.168.30.98/32 scram-sha-256
      - hostssl all all 192.168.30.99/32 scram-sha-256
      - hostssl all all 192.168.30.100/32 scram-sha-256

  bootstrap:
    initdb:
      database: postgres
      owner: postgres
      secret:
        name: credentials-admin

  enableSuperuserAccess: true
  superuserSecret:
    name: credentials-admin

  storage:
    size: 30Gi
    storageClass: longhorn-local

  # TODO(1.30): replace with spec.backup.plugins once CNPG 1.30+ is deployed
  backup:
    target: prefer-standby
    retentionPolicy: "14d"

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-backup

  managed:
    roles:
      - name: hass
        ensure: present
        passwordSecret:
          name: credentials-hass
        login: true
        createdb: true
        superuser: false
        createrole: false
        replication: false
        bypassrls: false
      # Jellystat cleanup phase B: drop the role; remove this entry in phase C
      - name: jellystat
        ensure: absent
        passwordSecret:
          name: credentials-jellystat
        login: true
        createdb: true
        superuser: false
        createrole: false
        replication: false
        bypassrls: false
      - name: firefly
        ensure: present
        passwordSecret:
          name: credentials-firefly
        login: true
        createdb: true
        superuser: false
        createrole: false
        replication: false
        bypassrls: false
      - name: immich
        ensure: present
        passwordSecret:
          name: credentials-immich
        login: true
        createdb: true
        superuser: false
        createrole: false
        replication: false
        bypassrls: false
      - name: lubelogger
        ensure: present
        passwordSecret:
          name: credentials-lubelogger
        login: true
        createdb: true
        superuser: false
        createrole: false
        replication: false
        bypassrls: false
      - name: buzz
        ensure: present
        passwordSecret:
          name: credentials-buzz
        login: true
        createdb: true
        superuser: false
        createrole: false
        replication: false
        bypassrls: false
      - name: dawarich
        ensure: present
        passwordSecret:
          name: credentials-dawarich
        login: true
        createdb: true
        superuser: false
        createrole: false
        replication: false
        bypassrls: false

    services:
      disabledDefaultServices: ["ro", "r"]
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: "postgres-external-rw"
              annotations:
                metallb.io/loadBalancerIPs: ${CNPG_LB}
            spec:
              type: LoadBalancer
              externalTrafficPolicy: Local

  monitoring:
    enablePodMonitor: false

  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  resources:
    requests:
      memory: 1Gi
      cpu: 500m
    limits:
      memory: 6Gi
      cpu: 2000m
