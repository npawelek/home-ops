# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/dragonflydb.io/dragonfly_v1alpha1.json
---
# Shared multi-tenant instance. One ACL user per app in dragonfly-acl (users.acl);
# ACLs cannot restrict DB indexes, so each tenant gets its own:
#   buzz      0           (REDIS_URL without /N)
#   dawarich  10, 11, 12  (RAILS_CACHE_DB, RAILS_JOB_QUEUE_DB, RAILS_WS_DB)
# ACL template: user <app> on ><pw> ~* &* +@all -flushall  (FLUSHALL wipes every DB)
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly
spec:
  replicas: 2
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: dragonfly
          topologyKey: kubernetes.io/hostname
  # renovate: datasource=docker depName=ghcr.io/dragonflydb/dragonfly
  image: ghcr.io/dragonflydb/dragonfly:v2.0.2@sha256:061f00b201b58e12f974e4e96c761a881ee1c05e9d8ee967466a604b7299753b
  # tlsSecretRef:
  #   name: dragonfly-tls
  # authentication:
  #   passwordFromSecret:
  #     name: dragonfly-acl
  #     key: authPassword
  aclFromSecret:
    name: dragonfly-acl
    key: users.acl
  # Dragonfly reads users.acl only at startup, and the operator reverts Reloader's
  # StatefulSet patches. Bump this whenever users.acl changes (date -u +%Y-%m-%dT%H:%MZ);
  # the pod-template change makes the operator roll replicas, then fail over the master.
  podMetadata:
    annotations:
      dragonfly.home-ops/acl-revision: "2026-10-04T21:50Z"
  args:
    - --maxmemory=$(MAX_MEMORY)Mi
    # sidekiq-limit_fetch (dawarich) Lua builds key names at runtime; Redis allows it, Dragonfly
    # rejects with "script tried accessing undeclared key" unless allowed. Costs broader script locking.
    - --default_lua_flags=allow-undeclared-keys
  env:
    - name: MAX_MEMORY
      valueFrom:
        resourceFieldRef:
          resource: limits.memory
          divisor: 1Mi
  snapshot:
    cron: "*/10 * * * *"
    persistentVolumeClaimSpec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
      storageClassName: longhorn
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 512Mi
