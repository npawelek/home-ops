---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: timescale
spec:
  schedule: "0 30 4 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: timescale-backup
  cluster:
    name: timescale
