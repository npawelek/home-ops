---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: database-timescale
  namespace: database
spec:
  interval: 1h
  path: ./kubernetes/apps/database/timescale/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
        optional: false
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: true
  healthCheckExprs:
    # CNPG Clusters have no Ready condition until the operator reconciles them; default kstatus calls that Current
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: has(status.conditions) && status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
    - name: cloudnative-pg
      namespace: cnpg-system
    - name: barman-cloud-plugin
      namespace: cnpg-system
    # Bucket + service account for credentials-timescale-backup-s3
    - name: rustfs-terraform
      namespace: storage
