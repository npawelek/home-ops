# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
spec:
  chartRef:
    kind: OCIRepository
    name: valkey
  interval: 1h
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      valkey:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: valkey/valkey
              tag: 9.1.2-alpine@sha256:ccfa19b0d743e48927e1c8c14e39e0acb97b5cea347fef0bfe340247fea920cd
            command:
              - valkey-server
              - --bind
              - "0.0.0.0"
              - --port
              - "6379"
              - --tls-port
              - "6380"
              - --tls-cert-file
              - /etc/ssl/certs/tls.crt
              - --tls-key-file
              - /etc/ssl/private/tls.key
              - --tls-auth-clients
              - "no"
              - --aclfile
              - /etc/valkey/users.acl
              - --save
              - "60"
              - "1"
              - --loglevel
              - warning
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - valkey-cli
                      - -p
                      - "6380"
                      - --tls
                      - --cacert
                      - /etc/ssl/certs/ca.crt
                      - ping
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 512Mi
          metrics:
            image:
              repository: oliver006/redis_exporter
              tag: v1.90.0-alpine@sha256:136a6aac1258bcb41449272fe0de1d71e65f8cd69514efb2a410b2fd2239a3ba
            env:
              REDIS_ADDR: rediss://valkey.database.svc.cluster.local:6380
              REDIS_EXPORTER_TLS_CLIENT_CERT_FILE: /etc/ssl/certs/tls.crt
              REDIS_EXPORTER_TLS_CLIENT_KEY_FILE: /etc/ssl/private/tls.key
              REDIS_EXPORTER_TLS_CA_CERT_FILE: /etc/ssl/certs/ca.crt
              REDIS_USER: metrics
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: valkey-acl
                    key: metricsPassword
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                cpu: 50m
                memory: 64Mi
    service:
      app:
        controller: valkey
        ports:
          valkey:
            port: 6379
          valkey-tls:
            port: 6380
          metrics:
            port: 9121
    serviceMonitor:
      app:
        enabled: true
        labels:
          monitoring: otel
        service:
          identifier: app
        endpoints:
          - port: metrics
            interval: 30s
            path: /metrics
    persistence:
      data:
        existingClaim: valkey-data
        globalMounts:
          - path: /data
      acl-config:
        type: secret
        name: valkey-acl
        globalMounts:
          - path: /etc/valkey/users.acl
            subPath: users.acl
            readOnly: true
      tls:
        type: secret
        name: valkey-tls
        globalMounts:
          - path: /etc/ssl/certs/tls.crt
            subPath: tls.crt
            readOnly: true
          - path: /etc/ssl/private/tls.key
            subPath: tls.key
            readOnly: true
      ca-bundle:
        type: configMap
        name: internal-ca-bundle
        globalMounts:
          - path: /etc/ssl/certs/ca.crt
            subPath: ca.crt
            readOnly: true
