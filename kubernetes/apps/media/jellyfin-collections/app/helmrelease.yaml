# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin-collections
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      jellyfin-collections:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: public.ecr.aws/docker/library/python
              tag: 3.14.10-alpine@sha256:eb2c62658b8d51bff0acc408504b76521d02030de56a8a3c1e830083e89b89d2
            command:
              - python3
              - /app/jellyfin_collections.py
              - serve
            envFrom:
              - secretRef:
                  name: jellyfin-collections-secrets
            env:
              TZ: ${TIMEZONE}
              DRY_RUN: "false"
              RECONCILE_HOUR: "4"
              JELLYFIN_URL: http://jellyfin.media.svc.cluster.local:8096
              RADARR_URL: http://radarr.downloads.svc.cluster.local:7878
              RADARR_REMUX_URL: http://radarr-remux.downloads.svc.cluster.local:7878
              OLLAMA_URL: http://ollama.network.svc.cluster.local:11434
              OLLAMA_MODEL: ${OLLAMA_MODEL}
              PYTHONDONTWRITEBYTECODE: "1"
              PYTHONUNBUFFERED: "1"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  periodSeconds: 1
                  timeoutSeconds: 2
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 384Mi
    defaultPodOptions:
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: jellyfin-collections
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{.Release.Name}}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: gateway
            sectionName: https
        rules:
          - matches:
              - method: POST
                path:
                  type: Exact
                  value: /reconcile
              - method: POST
                path:
                  type: Exact
                  value: /reevaluate
            backendRefs:
              - identifier: app
                port: *port
    persistence:
      app:
        type: configMap
        name: jellyfin-collections-app
        globalMounts:
          - path: /app
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
