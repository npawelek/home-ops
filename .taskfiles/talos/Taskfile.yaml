---
version: '3'

tasks:

  nodes:
    desc: List all nodes and their current state
    dir: '{{.TALOS_DIR}}'
    cmd: topf nodes
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - which topf

  render:
    desc: Render machine configs to talos/output without applying them
    dir: '{{.TALOS_DIR}}'
    cmd: topf render
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  talosconfig:
    desc: Regenerate talosconfig from the secrets bundle
    dir: '{{.TALOS_DIR}}'
    cmd: topf talosconfig > {{.TALOSCONFIG}}
    preconditions:
      - test -f {{.TALOS_DIR}}/secrets.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  diff:
    desc: Show what an apply would change on every node, without applying
    dir: '{{.TALOS_DIR}}'
    # `topf apply --dry-run` exits 2 when there are changes to apply. That is the signal,
    # not an error, so treat it as success and let any other non-zero code fail the task.
    # silent: the multi-line cmd would otherwise echo its own shell body on every run.
    silent: true
    cmd: |
      rc=0
      topf apply --dry-run || rc=$?
      if [ "$rc" -eq 2 ]; then
        echo "==> Changes are pending (topf exit 2). Apply with: task talos:apply-node HOST=?"
      elif [ "$rc" -ne 0 ]; then
        exit "$rc"
      fi
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.TALOS_DIR}}/secrets.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  apply:
    desc: Apply Talos config to every node [MODE=auto]
    dir: '{{.TALOS_DIR}}'
    cmd: topf apply --mode={{.MODE}}
    vars:
      MODE: '{{.MODE | default "auto"}}'
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.TALOS_DIR}}/secrets.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  apply-node:
    desc: Apply Talos config to a single node [HOST=required, MODE=auto]
    dir: '{{.TALOS_DIR}}'
    # topf dials nodes in maintenance mode too, so this also bootstraps a new node.
    cmd: topf apply --nodes-filter '^{{.HOST}}$' --mode={{.MODE}}
    vars:
      MODE: '{{.MODE | default "auto"}}'
    requires:
      vars: [HOST]
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.TALOS_DIR}}/secrets.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  upgrade:
    desc: Upgrade Talos on every node, draining each one first
    dir: '{{.TALOS_DIR}}'
    cmd: topf upgrade
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.TALOS_DIR}}/secrets.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - test -f {{.KUBECONFIG}}
      - which topf

  upgrade-node:
    desc: Upgrade Talos on a single node [HOST=required]
    dir: '{{.TALOS_DIR}}'
    # --drain defaults to true, so Longhorn PDBs gate the reboot.
    cmd: topf upgrade --nodes-filter '^{{.HOST}}$'
    requires:
      vars: [HOST]
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.TALOS_DIR}}/secrets.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - test -f {{.KUBECONFIG}}
      - which topf

  upgrade-k8s-safe:
    desc: Upgrade Kubernetes per-node, gating each step on drain PDBs and Longhorn rebuild
    dir: '{{.TALOS_DIR}}'
    vars:
      KUBERNETES_VERSION:
        sh: yq '.kubernetesVersion' {{.TALOS_DIR}}/topf.yaml
      CONTROL_PLANE_IP:
        sh: yq '[.nodes[] | select(.role == "control-plane")][0].ip' {{.TALOS_DIR}}/topf.yaml
      # Worker kubelet order, space-separated hostnames. Control-plane nodes always go
      # first, in topf.yaml order. Override with e.g. WORKERS="hammurabi pella donnager".
      TOPF_WORKERS:
        sh: yq '[.nodes[] | select(.role != "control-plane") | .host] | join(" ")' {{.TALOS_DIR}}/topf.yaml
      WORKERS: '{{.WORKERS | default .TOPF_WORKERS}}'
    cmds:
      - |
        echo "==> Upgrading control plane components to {{.KUBERNETES_VERSION}} (no drain)..."
        talosctl --nodes {{.CONTROL_PLANE_IP}} upgrade-k8s --to '{{.KUBERNETES_VERSION}}' --upgrade-kubelet=false
      - |
        # Stop at the first failed step so a node is never uncordoned, and the next
        # node never drained, after a failed patch, Ready wait or Longhorn gate.
        set -euo pipefail
        nodes=$(
          yq '.nodes[] | select(.role == "control-plane") | .ip + " " + .host' {{.TALOS_DIR}}/topf.yaml
          for host in {{.WORKERS}}; do
            HOST="${host}" yq '.nodes[] | select(.host == strenv(HOST)) | .ip + " " + .host' {{.TALOS_DIR}}/topf.yaml
          done
        )
        total=$(echo "$nodes" | wc -l | tr -d ' ')
        count=0
        while IFS=' ' read -r ip hostname; do
          count=$((count + 1))
          echo ""
          echo "==> [${count}/${total}] Upgrading kubelet on ${hostname} (${ip})..."
          # No CNPG pre-promotion: the drain hits each cluster's primary PDB and CNPG
          # switches over by itself. A manual promote here demoted the old primary under
          # the node's old kubelet, which never restarted it, and left a replica diverged
          # by the old primary's shutdown checkpoint (see the k8s 1.36 ExecPlan).
          echo "    Draining ${hostname} (blocks until PDBs allow)..."
          kubectl drain "${hostname}" --ignore-daemonsets --delete-emptydir-data --timeout=0
          echo "    Patching kubelet image to {{.KUBERNETES_VERSION}}..."
          # Talos 1.14 multi-doc config: the kubelet image lives in the KubeletConfig
          # document, not /machine/kubelet. This matches upstream's stdpatches.WithKubeletImage.
          patchfile=$(mktemp)
          printf 'apiVersion: v1alpha1\nkind: KubeletConfig\nimage: ghcr.io/siderolabs/kubelet:%s\n' \
            '{{.KUBERNETES_VERSION}}' >"${patchfile}"
          talosctl patch mc --nodes "${ip}" --mode=no-reboot --patch @"${patchfile}"
          rm -f "${patchfile}"
          # The node is still Ready on the old kubelet right after the patch, so wait
          # for the new version to report before trusting the Ready condition.
          echo "    Waiting for ${hostname} to report kubelet {{.KUBERNETES_VERSION}} and be Ready..."
          kubectl wait node "${hostname}" --timeout=5m \
            --for=jsonpath='{.status.nodeInfo.kubeletVersion}'='{{.KUBERNETES_VERSION}}'
          kubectl wait node "${hostname}" --for=condition=Ready --timeout=5m
          echo "    Uncordoning ${hostname}..."
          kubectl uncordon "${hostname}"
          # Uncordon BEFORE gating on Longhorn: instance-manager does not tolerate the
          # unschedulable taint, so a cordoned node can never rebuild its stale replicas
          # and the gate would sit until it times out.
          echo "    Waiting for Longhorn to finish rebuilding before the next node..."
          task longhorn:wait-healthy
          echo "==> [${count}/${total}] ${hostname} complete."
        done <<< "$nodes"
        echo ""
        echo "==> All nodes upgraded to Kubernetes {{.KUBERNETES_VERSION}}."
    preconditions:
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - test -f {{.KUBECONFIG}}
      - which kubectl talosctl task yq
      - sh: |
          topf_workers=$(yq '.nodes[] | select(.role != "control-plane") | .host' {{.TALOS_DIR}}/topf.yaml)
          [ "$(printf '%s\n' {{.WORKERS}} | sort | tr '\n' ' ')" = "$(echo "${topf_workers}" | sort | tr '\n' ' ')" ]
        msg: 'WORKERS="{{.WORKERS}}" must list every worker in talos/topf.yaml exactly once'

  reset:
    desc: Resets nodes back to maintenance mode
    dir: '{{.TALOS_DIR}}'
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    # --full=false wipes only STATE and EPHEMERAL, matching the non-forced talosctl reset
    cmd: topf reset --full={{.CLI_FORCE}} --graceful=false
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.TALOS_DIR}}/secrets.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf
