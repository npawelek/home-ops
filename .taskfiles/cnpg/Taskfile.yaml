---
version: '3'

tasks:

  primaries:
    desc: List primary and replica instances (with nodes) for every CNPG cluster
    silent: true
    cmd: |
      kubectl get pods -A -l cnpg.io/podRole=instance -o json | jq -r '
        [.items[] | {
          ns: .metadata.namespace,
          cluster: .metadata.labels["cnpg.io/cluster"],
          role: .metadata.labels["cnpg.io/instanceRole"],
          cell: (.metadata.name + " (" + (.spec.nodeName // "?") + ")"
            + (if any(.status.conditions[]?; .type == "Ready" and .status == "True") then "" else " NOT-READY" end))
        }]
        | group_by([.ns, .cluster])
        | map({
            ns: .[0].ns,
            cluster: .[0].cluster,
            primary: ([.[] | select(.role == "primary") | .cell] | first // "-"),
            replicas: ([.[] | select(.role != "primary") | .cell] | sort)
          })
        | (map(.replicas | length) | max // 0) as $n
        | (["NAMESPACE", "CLUSTER", "PRIMARY"] + [range($n) | "REPLICA_\(. + 1)"]),
          (.[] | [.ns, .cluster, .primary] + [range($n) as $i | .replicas[$i] // "-"])
        | @tsv
      ' | column -t -s $'\t'
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which kubectl
      - which jq

  status-authentik:
    desc: Show CNPG cluster status for authentik-postgres in the auth namespace
    cmd: kubectl cnpg status authentik-postgres -n auth
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which kubectl

  status-postgres:
    desc: Show CNPG cluster status for postgres in the database namespace
    cmd: kubectl cnpg status postgres -n database
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which kubectl

  status-timescale:
    desc: Show CNPG cluster status for timescale in the database namespace
    cmd: kubectl cnpg status timescale -n database
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which kubectl

  promote-authentik:
    desc: Promote a given instance to primary in the auth namespace [NODE=required]
    cmds:
      - kubectl cnpg status authentik-postgres -n auth
      - kubectl cnpg promote authentik-postgres {{.NODE}} -n auth
      - sleep 30
      - kubectl cnpg status authentik-postgres -n auth
    requires:
      vars: [NODE]
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which kubectl

  promote-postgres:
    desc: Promote a given instance to primary in the database namespace [NODE=required]
    cmds:
      - kubectl cnpg status postgres -n database
      - kubectl cnpg promote postgres {{.NODE}} -n database
      - sleep 30
      - kubectl cnpg status postgres -n database
    requires:
      vars: [NODE]
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which kubectl

  promote-timescale:
    desc: Promote a given instance to primary for timescale in the database namespace [NODE=required]
    cmds:
      - kubectl cnpg status timescale -n database
      - kubectl cnpg promote timescale {{.NODE}} -n database
      - sleep 30
      - kubectl cnpg status timescale -n database
    requires:
      vars: [NODE]
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which kubectl
