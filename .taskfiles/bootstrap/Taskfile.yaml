---
version: '3'

tasks:

  talos:
    desc: Bootstrap the Talos cluster
    dir: '{{.TALOS_DIR}}'
    shell: bash
    cmds:
      # `topf secrets` writes secrets.yaml itself, so let it, then encrypt in place.
      # Piping its stdout into the same path races topf's own write and leaves the
      # plaintext bundle on disk if sops fails. --confirm=false is required: the
      # "generate a new one?" prompt goes to stdout.
      - >-
        [ -f secrets.yaml ] ||
        { topf secrets --confirm=false >/dev/null && sops -e -i secrets.yaml; }
      - topf talosconfig > {{.TALOSCONFIG}}
      # --auto-bootstrap runs the etcd bootstrap once the control plane accepts the config
      - topf apply --auto-bootstrap --confirm=false
      # topf kubeconfig is only valid for 12h; talosctl issues the durable admin one
      - until talosctl kubeconfig {{.ROOT_DIR}} --force; do sleep 10; done
    preconditions:
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - test -f {{.TALOS_DIR}}/topf.yaml
      - which topf talosctl sops

  apps:
    desc: Bootstrap apps into the Talos cluster
    shell: bash
    cmd: bash {{.SCRIPTS_DIR}}/bootstrap-apps.sh
    preconditions:
      - msg: Unsupported bash version, run `brew install bash` to upgrade
        sh: '{{if eq OS "darwin"}}test -f /opt/homebrew/bin/bash || test -f /usr/local/bin/bash{{end}}'
      - test -f {{.KUBECONFIG}}
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SCRIPTS_DIR}}/bootstrap-apps.sh
      - test -f {{.SOPS_AGE_KEY_FILE}}
