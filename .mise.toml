[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"
SECRET_DOMAIN = { value = "{{exec(command='sops -d env.sops.yaml | yq .SECRET_DOMAIN')}}", tools = true, redact = true }
HOMEASSISTANT_URL = { value = "{{exec(command='sops -d env.sops.yaml | yq .HOMEASSISTANT_URL')}}", tools = true, redact = true }
HOMEASSISTANT_TOKEN = { value = "{{exec(command='sops -d env.sops.yaml | yq .HOMEASSISTANT_TOKEN')}}", tools = true, redact = true }
GRAFANA_URL = { value = "{{exec(command='sops -d env.sops.yaml | yq .GRAFANA_URL')}}", tools = true, redact = true }
GRAFANA_SERVICE_ACCOUNT_TOKEN = { value = "{{exec(command='sops -d env.sops.yaml | yq .GRAFANA_SERVICE_ACCOUNT_TOKEN')}}", tools = true, redact = true }
GRAFANA_ORG_ID = "1"
FLUX_SCHEMA_CONFIG = "{{config_root}}/.fluxschema.yml"
# Render offline as the live cluster would: Kubernetes version from Talos, and
# Gateway API in .Capabilities (else app-template emits HTTPRoute v1alpha2).
# .github/workflows/flate.yaml reads both from the same sources.
FLATE_KUBE_VERSION = { value = "{{exec(command='yq .kubernetesVersion talos/topf.yaml')}}", tools = true }
FLATE_API_VERSIONS = "gateway.networking.k8s.io/v1/HTTPRoute"
AWS_PROFILE = "default"
AWS_REGION = "us-east-1"

[settings]
experimental = true
python.uv_venv_auto = true

[hooks]
postinstall = "mise run i"
enter = "mise run check-deps"

[tools]
"aqua:astral-sh/uv" = "0.12.23"
"aqua:awscli" = "2.37.9"
"aqua:BurntSushi/ripgrep" = "15.2.0"
"aqua:cilium/cilium-cli" = "0.20.1"
"aqua:cli/cli" = "2.102.0"
# TODO: verify Renovate tracks this inline-table pin (first bump PR, or Dependency Dashboard lists aqua:controlplaneio-fluxcd/flux-operator)
"aqua:controlplaneio-fluxcd/flux-operator" = { version = "0.61.0", postinstall = "flux-operator skills install ghcr.io/fluxcd/agent-skills --agent claude-code" }
"aqua:controlplaneio-fluxcd/flux-operator/flux-operator-mcp" = "0.61.0"
"aqua:cue-lang/cue" = "0.17.1"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:fluxcd/flux2" = "2.9.6"
"aqua:getsops/sops" = "3.13.3"
"aqua:go-task/task" = "3.54.0"
"aqua:google/go-containerregistry" = "0.22.1"
"aqua:grafana/mcp-grafana" = "2.0.1"
"aqua:helm/helm" = "4.3.0"
"aqua:helmfile/helmfile" = "1.8.1"
"aqua:jqlang/jq" = "1.8.1"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:kubernetes-sigs/kustomize" = "5.7.1"
"aqua:kubernetes/kubectl" = "1.36.1"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:opentofu/opentofu" = "1.13.1"
"aqua:pre-commit" = "4.6.2"
"aqua:siderolabs/talos" = "1.14.2"
"go" = "1.27.1"
"go:github.com/fiatjaf/nak" = "0.21.0"
"node" = "24.21.0"
"npm:mcp-remote" = "0.14.3"
# libzip 3.2.2: maintainer (arcanis) manual publish without provenance, 3.2.0 had it; accepted 2026-10-04
# TODO: verify Renovate tracks this inline-table pin (first bump PR/automerge, or Dependency Dashboard lists npm:renovate)
"npm:renovate" = { version = "44.133.0", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }
"github:fluxcd/flux-schema" = "0.15.0"
"github:home-operations/flate" = "0.6.5"
"github:postfinance/topf" = "0.6.1"
"pipx:asitop" = "0.0.24"
"pipx:ha-mcp" = "8.6.0"
"pipx:makejinja" = "2.9.1"
"pipx:yamllint" = "1.38.0"
"python" = "3.14.8"
"claude" = "2.1.291"

[shell_alias]
k = "kubectl"

[tasks.install]
description = "Install Python dependencies"
alias = "i"
run = """
  [ -e .venv/bin/python ] || uv venv --clear
  uv pip install -r requirements.txt
"""

[tasks.check-deps]
description = "Check if Python dependencies need updating"
silent = true
run = '''
  OUTDATED=$(uv pip list --outdated 2>/dev/null)
  if [ -n "$OUTDATED" ]; then
    echo "⚠️  Python dependencies have updates available. Run 'mise install' to update"
  fi
'''
