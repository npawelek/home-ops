---
# Recipients by name. Private keys live in age.key (gitignored; sops tries each identity).
keys:
  - &cluster age185l4m6q0d4dxv4kd6slhlqgl88fyz3xlx8xkv76tyfr4chvw6eys96xsu9
  - &nixos_admin 
  - &pella 

creation_rules:
  - path_regex: env\.sops\.ya?ml
    mac_only_encrypted: true
    age: *cluster
  - path_regex: talos/secrets\.ya?ml
    mac_only_encrypted: true
    age: *cluster
  - path_regex: talos/.*\.sops\.ya?ml
    mac_only_encrypted: true
    age: *cluster
  - path_regex: ipxe/.*\.sops\.ya?ml
    mac_only_encrypted: true
    age: *cluster
  - path_regex: (bootstrap|kubernetes)/.*\.sops\.ya?ml
    encrypted_regex: "^(data|stringData)$"
    mac_only_encrypted: true
    age: *cluster
  - path_regex: nixos/secrets/.*\.sops\.ya?ml
    mac_only_encrypted: true
    key_groups:
      - age:
          - *nixos_admin
          - *pella
stores:
  yaml:
    indent: 2
